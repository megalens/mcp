name: publish

# Publishes megalens-mcp to npm with no stored token.
#
# npm revoked all classic tokens on 2025-12-09 and capped granular write tokens
# at 90 days, so there is no such thing as a permanent npm credential any more.
# Trusted publishing (OIDC) is the replacement: npm verifies that the publish
# came from this exact workflow in this exact repository, and mints a short-lived
# credential for it. Nothing to store, nothing to rotate, nothing to leak.
#
# The npm side of this is configured once, by hand, at
# npmjs.com → megalens-mcp → Settings → Trusted Publisher:
#   organization: megalens   repository: mcp   workflow: publish.yml
# If that entry is missing or its workflow filename does not match this file's
# name exactly, the publish step fails with an auth error — the file name is
# part of the identity npm checks.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. Without it the runner cannot mint an identity token and
  # npm falls back to looking for a token that is not there.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. The Node 22 images ship npm 10.x,
      # which would authenticate the old way and fail.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # Fail closed on a tag that does not match what is about to be published.
      # A mistyped tag would otherwise publish a version nobody asked for, under
      # a name that suggests otherwise.
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "publishing $PKG"

      # No NODE_AUTH_TOKEN. The npm CLI detects the OIDC environment and uses it.
      - name: Publish
        run: npm publish
